services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: workflow, POSTGRES_PASSWORD: workflow, POSTGRES_DB: workflow }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U workflow"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg://workflow:workflow@db:5432/workflow
      SECRET_KEY: change-me-to-a-long-random-string
      AUTO_CREATE_TABLES: "false"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
volumes: { pgdata: {}, uploads: {} }
